# 로컬 개발 스택 — AWS 계정 없이 전 구간을 재현한다.
#
# Mosquitto가 로컬 개발 브로커다. 운영에서는 이 자리를 AWS IoT Core가 대체하며,
# **토픽·페이로드 계약은 동일하다** (명세 §4 Phase 0).
#
#   make up      /  docker compose -f compose/docker-compose.dev.yml up -d
#   make down
#
# 애플리케이션은 api(ingest 포함)와 inference 두 서비스다. inference는 실제 가중치가
# 있어야 하므로 `--profile model`에서만 기동한다.

name: wifiguard-dev

services:
  # ── 엣지 업링크 (운영: AWS IoT Core) ──────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"   # 로컬 개발은 평문. 운영 mTLS 8883은 IoT Core가 담당
      - "9001:9001"
    volumes:
      - ../infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../infra/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 4s
      retries: 12

  # ── 스트림 ────────────────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.9
    ports:
      - "9092:9092"
    environment:
      # KRaft 모드 — zookeeper 불필요
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 infra/kafka/ 정의로 명시 생성
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka-init:
    image: bitnami/kafka:3.9
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -ec '
      until /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list; do sleep 2; done;
      for topic in csi-feature-stream csi-telemetry csi-inference-result; do
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1;
      done'

  # ── 저장 ──────────────────────────────────────────────────────────
  # 이원화: 고빈도 시계열은 TimescaleDB, 관계형은 PostgreSQL (명세 §4 Phase 1-1)
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "${TSDB_NAME:-wifiguard_ts}"
      POSTGRES_USER: "${TSDB_USER:-wifiguard}"
      POSTGRES_PASSWORD: "${TSDB_PASSWORD:?set in .env}"
    volumes:
      - ../infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${PG_NAME:-wifiguard}"
      POSTGRES_USER: "${PG_USER:-wifiguard}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:?set in .env}"
    volumes:
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── WebSocket 팬아웃 (다수 클라이언트 × 다수 기기) ─────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ── 오브젝트 스토리지 (모델 아티팩트 · CSI/피처 윈도우) ─────────────
  # window(피처)는 232KB/윈도우다. TimescaleDB에 넣지 않고 여기 두고 DB에는 포인터만.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:?set in .env}"
    volumes:
      - minio-data:/data

  # ── 모델 레지스트리 ────────────────────────────────────────────────
  # ⚠ MLflow는 이 프로젝트 어디에서도 실제로 쓰인 적이 없다. 완전한 신규 도입이다 (명세 R7).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${PG_USER:-wifiguard}:${PG_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_PASSWORD}"
    depends_on:
      - postgres
      - minio

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://${PG_USER:-wifiguard}:${PG_PASSWORD}@postgres:5432/${PG_NAME:-wifiguard}"
      TSDB_DSN: "postgresql://${TSDB_USER:-wifiguard}:${TSDB_PASSWORD}@timescaledb:5432/${TSDB_NAME:-wifiguard_ts}"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "0"
      KAFKA_BOOTSTRAP: "kafka:29092"
      JWT_SECRET: "${JWT_SECRET:?set in .env}"
      ALLOW_FALL_SIMULATE: "${ALLOW_FALL_SIMULATE:-0}"
    command: >
      sh -ec 'alembic -c /app/packages/db/alembic.ini upgrade head &&
      uvicorn wifiguard_api.app:app --host 0.0.0.0 --port 8000 --workers 1'
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: "on-failure:5"

  inference:
    profiles: ["model"]
    build:
      context: ../..
      dockerfile: WIFIGUARD-BACKEND/services/inference/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: "kafka:29092"
      KAFKA_INFERENCE_GROUP: "wifiguard-inference-v1"
      MODEL_CHECKPOINT: /models/model.pt
      MODEL_DEVICE: "${MODEL_DEVICE:-cpu}"
      MODEL_THRESHOLD: "${MODEL_THRESHOLD:-}"
    volumes:
      - "${MODEL_CHECKPOINT_HOST:-../weights/model.pt}:/models/model.pt:ro"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "on-failure:5"

volumes:
  mosquitto-data:
  kafka-data:
  timescale-data:
  postgres-data:
  redis-data:
  minio-data:

# 관측 스택(prometheus/grafana/alertmanager/loki)은 compose/docker-compose.obs.yml 로 분리.
# Airflow는 재학습 루프(Phase 6)에 들어갈 때 추가한다 — 지금 띄워도 돌릴 DAG가 없다.
