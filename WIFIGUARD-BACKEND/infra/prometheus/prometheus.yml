global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: wifiguard-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9108"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
