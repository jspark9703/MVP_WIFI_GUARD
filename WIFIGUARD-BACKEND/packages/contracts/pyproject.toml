[project]
name = "wifiguard-contracts"
version = "0.1.0"
description = "WIFI-GUARD 레포 간 스키마 SSOT — REST/WS 요청·응답 Pydantic v2 모델 (→ OpenAPI → 프론트 코드젠)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wifiguard_contracts"]
