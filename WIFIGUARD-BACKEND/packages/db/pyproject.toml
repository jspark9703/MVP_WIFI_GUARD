[project]
name = "wifiguard-db"
version = "0.1.0"
description = "WIFI-GUARD 관계형 스키마 — SQLAlchemy 2.x 모델 + Alembic 마이그레이션 (PostgreSQL 16)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wifiguard_db"]
