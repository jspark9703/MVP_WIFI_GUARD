# Alembic config for the WIFI-GUARD relational schema (ASCII only: Alembic reads this file with the OS locale).
#   from the backend root:  uv run alembic -c packages/db/alembic.ini upgrade head
#   The connection string comes from wifiguard_db.settings (DATABASE_URL) inside env.py; sqlalchemy.url below is a placeholder.

[alembic]
script_location = %(here)s/src/wifiguard_db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/src
path_separator = os
timezone = UTC
sqlalchemy.url = postgresql+psycopg://placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
