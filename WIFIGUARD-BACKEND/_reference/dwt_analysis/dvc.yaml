stages:

  preprocess:
    cmd: python scripts/preprocess.py --config config/preprocess.yaml
    deps:
      - scripts/preprocess.py
      - src/dwt_coef/data_loader.py
      - src/dwt_coef/preprocessing.py
      - config/preprocess.yaml
    params:
      - config/preprocess.yaml:
          - data.env
          - data.subjects
          - data.activities
          - data.fall_only
          - window.size_sec
          - window.stride_sec
          - resample.fs_hz
          - resample.tolerance_ms
          - filter.low_hz
          - filter.high_hz
          - filter.order
          - stream_selection.omega
          - stream_selection.n_streams
          - stream_selection.use_ant
          - pca.eigenvalue_threshold
          - pca.max_pcs
    outs:
      - data/preprocessed/

  featurize:
    cmd: python scripts/featurization.py --config config/featurization.yaml
    deps:
      - scripts/featurization.py
      - src/dwt_coef/dwt_features.py
      - config/featurization.yaml
      - data/preprocessed/
    params:
      - config/featurization.yaml:
          - dwt.wavelet
          - dwt.level
          - dwt.include_entropy
          - filter.env
          - filter.subjects
          - filter.activities
          - filter.fall_only
    outs:
      - data/features/

