# Fall Segment Extraction - Parameters

# Moving variance computation
moving_variance:
  omega: 64                    # Window half-width (2W+1 = 129 samples total)
  n_streams: 3             # Number of top streams to average

# Fall segment detection (per-file min-max normalized signal)
detection:
  norm_threshold: 0.2          # Normalized MV threshold [0, 1]
  min_duration: 0.5            # Minimum segment duration (seconds)
  merge_threshold: 0.25        # Gap for merging adjacent segments (seconds)
  max_duration: 2.0            # Hard cap on segment duration (seconds)

# Processing
processing:
  max_files: 50              # Maximum files to process (null = all files, e.g., 50 for testing)
  visualize: false             # Generate visualization plots during processing
