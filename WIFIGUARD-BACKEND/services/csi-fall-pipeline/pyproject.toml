[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-fall-pipeline"
version = "0.1.0"
description = "Raw CSI to ACF/CWT features, fall model training, and prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11,<2", "pandas>=2,<4", "scikit-learn>=1.3,<2", "torch>=2.6,<3"]

[project.optional-dependencies]
cwt = ["ssqueezepy==0.6.6"]
resnet = ["torchvision>=0.21,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
csi-fall = "csi_fall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
