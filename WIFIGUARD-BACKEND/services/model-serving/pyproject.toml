[project]
name = "wifiguard-serving"
version = "0.1.0"
description = "WIFI-GUARD model checkpoint loader and inference engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "torch>=2.6,<3",
  "csi-fall-pipeline",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wifiguard_serving"]

[tool.uv.sources]
csi-fall-pipeline = { path = "../csi-fall-pipeline", editable = true }
